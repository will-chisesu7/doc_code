<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wilson Chisessu — Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
    .card { background: #1e293b; border-radius: 16px; max-width: 700px; width: 100%; padding: 40px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; color: #f1f5f9; }
    .role { color: #3b82f6; font-size: 1rem; margin-top: 4px; }
    .location { color: #94a3b8; font-size: 0.9rem; margin-top: 4px; }
    .email { color: #94a3b8; font-size: 0.9rem; margin-top: 2px; }
    .section { margin-top: 28px; }
    .section h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 12px; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill { background: #0f172a; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: #93c5fd; }
    .projects { display: flex; flex-direction: column; gap: 10px; }
    .project { background: #0f172a; border: 1px solid #334155; padding: 14px 18px; border-radius: 10px; }
    .project h3 { font-size: 0.95rem; color: #f1f5f9; }
    .project p { font-size: 0.82rem; color: #94a3b8; margin-top: 4px; }
    .social a { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
    .social a:hover { text-decoration: underline; }
    .divider { border: none; border-top: 1px solid #334155; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="card" id="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="location" id="location"></div>
    <div class="email" id="email"></div>
    <hr class="divider"/>
    <div class="section">
      <h2>Skills</h2>
      <div class="skills" id="skills"></div>
    </div>
    <div class="section">
      <h2>Projects</h2>
      <div class="projects" id="projects"></div>
    </div>
    <div class="section social">
      <h2>Social</h2>
      <div id="social"></div>
    </div>
  </div>

  <script>
    fetch('profile.json')
      .then(r => r.json())
      .then(p => {
        document.getElementById('avatar').textContent = p.name.charAt(0);
        document.getElementById('name').textContent = p.name;
        document.getElementById('role').textContent = p.role;
        document.getElementById('location').textContent = '📍 ' + p.location;
        document.getElementById('email').textContent = '✉️ ' + p.email;

        p.skills.forEach(s => {
          const span = document.createElement('span');
          span.className = 'skill';
          span.textContent = s;
          document.getElementById('skills').appendChild(span);
        });

        p.projects.forEach(proj => {
          const div = document.createElement('div');
          div.className = 'project';
          div.innerHTML = `<h3>${proj.name}</h3><p>${proj.description}</p>`;
          document.getElementById('projects').appendChild(div);
        });

        Object.entries(p.social).forEach(([platform, url]) => {
          const a = document.createElement('a');
          a.href = 'https://' + url;
          a.target = '_blank';
          a.textContent = platform.charAt(0).toUpperCase() + platform.slice(1) + ': ' + url;
          document.getElementById('social').appendChild(a);
        });
      });
  </script>
</body>
</html>
